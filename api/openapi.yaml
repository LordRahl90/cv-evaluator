openapi: 3.1.0

info:
  title: CV Evaluator API
  version: 0.1.0
  summary: Match CVs against job postings with semantic search.
  description: |
    The CV Evaluator API is organized around REST. It has predictable,
    resource-oriented URLs, accepts JSON request bodies, returns JSON
    responses, and uses standard HTTP response codes, authentication and verbs.

    ## Authentication

    Every request other than sign up and sign in must be authenticated with a
    bearer credential in the `Authorization` header. Two kinds of credential
    are accepted, and they are interchangeable on every authenticated endpoint:

    | Credential | Looks like | Get one from | Lifetime |
    |---|---|---|---|
    | Session token | a JWT (`eyJhbGciOi...`) | `POST /auth/signup` or `POST /auth/signin` | 24 hours |
    | API key | `sk_live_` followed by 40 characters | `POST /api-keys` | until revoked |

    ```http
    Authorization: Bearer sk_live_<your_api_key>
    ```

    Changing the password (`POST /me/password`) ends every session token
    issued before the change; the response carries a fresh one. API keys are
    not affected by a password change: revoke them separately with
    `DELETE /api-keys/{id}`. Deleting the account ends every credential.

    Use session tokens from interactive clients (a browser or mobile app) and
    API keys from scripts, servers and CI. API keys carry the same privileges
    as your account, so keep them secret: do not commit them to source control
    or embed them in client-side code. If a key leaks, revoke it with
    `DELETE /api-keys/{id}` and create a new one.

    ## Errors

    The API uses conventional HTTP status codes: `2xx` means success, `4xx`
    means the request was rejected because of something the caller sent, and
    `5xx` means something went wrong on our side.

    Every error response has the same shape, an `error` object with a `type`,
    an optional `code`, a human-readable `message` and, when a specific request
    parameter is at fault, a `param`:

    ```json
    {
      "error": {
        "type": "invalid_request_error",
        "code": "parameter_missing",
        "message": "The email parameter is required.",
        "param": "email"
      }
    }
    ```

    Branch on `type` and `code`; they are stable. `message` is meant for
    humans and may change.

    ## Identifiers

    Object ids are [ULIDs](https://github.com/ulid/spec): 26-character,
    lexicographically sortable strings such as `01J9ZK6H3P8Q4W2X5Y7R1T0V3N`.
  contact:
    name: CV Evaluator

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Authentication
    description: |
      Create an account and exchange credentials for a session token.
      These endpoints are public.
  - name: Users
    description: |
      The account behind the credential used to call the API: read and edit
      the profile, change the password, download everything stored about
      you, and delete the account.
  - name: API keys
    description: |
      Personal API keys let scripts and servers call the API on your behalf
      without a password. The full secret is returned exactly once, when the
      key is created; afterwards only its `prefix` is shown, so store the
      secret somewhere safe straight away. Revoking a key takes effect
      immediately.
  - name: Job searches
    description: |
      Saved searches that run on a schedule. Every search runs against all
      supported job portals; you only say what to look for, where and how
      often. Runs happen in the background.
  - name: Job portals
    description: |
      The job portals the platform searches, and suggestions for new ones.

security:
  - sessionToken: []
  - apiKey: []

paths:
  /auth/signup:
    post:
      operationId: signup
      tags: [Authentication]
      summary: Create an account
      description: |
        Creates a new user and returns a session token, so the caller is
        signed in straight away. Email addresses are case-insensitive and
        must be unique, as must phone numbers when given.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            example:
              first_name: Ada
              last_name: Lovelace
              email: ada@example.com
              phone: '+4512345678'
              password: correct-horse-battery
      responses:
        '201':
          description: The account was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                session:
                  $ref: '#/components/examples/Session'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          description: |
            An account with this email (`email_already_used`) or phone number
            (`phone_already_used`) already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                email:
                  summary: Email already used
                  value:
                    error:
                      type: invalid_request_error
                      code: email_already_used
                      message: An account with this email already exists.
                      param: email
                phone:
                  summary: Phone already used
                  value:
                    error:
                      type: invalid_request_error
                      code: phone_already_used
                      message: An account with this phone number already exists.
                      param: phone
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/signin:
    post:
      operationId: signin
      tags: [Authentication]
      summary: Sign in
      description: |
        Exchanges an email and password for a new session token. For
        security, the response does not reveal whether the email exists:
        an unknown email and a wrong password both return
        `invalid_credentials`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SigninRequest'
            example:
              email: ada@example.com
              password: correct-horse-battery
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                session:
                  $ref: '#/components/examples/Session'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: The email or password is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  type: authentication_error
                  code: invalid_credentials
                  message: The email or password is incorrect.
        '500':
          $ref: '#/components/responses/InternalError'

  /me:
    get:
      operationId: getCurrentUser
      tags: [Users]
      summary: Retrieve the current user
      description: |
        Returns the user that owns the credential on the request. Handy for
        checking that a session token or API key works.
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                user:
                  $ref: '#/components/examples/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateCurrentUser
      tags: [Users]
      summary: Update the current user
      description: |
        Updates the fields that are present and leaves the others as they
        are. Values are trimmed; the email is lowercased and must be a valid,
        unused address, and a phone number, when not empty, must be unused.
        Send an empty string to clear `first_name`, `last_name` or `phone`.
        An empty object changes nothing and returns the current profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            example:
              last_name: King
              email: ada.king@example.com
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                user:
                  $ref: '#/components/examples/User'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '409':
          description: |
            Another account already uses this email (`email_already_used`) or
            phone number (`phone_already_used`). Nothing was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                email:
                  summary: Email already used
                  value:
                    error:
                      type: invalid_request_error
                      code: email_already_used
                      message: An account with this email already exists.
                      param: email
                phone:
                  summary: Phone already used
                  value:
                    error:
                      type: invalid_request_error
                      code: phone_already_used
                      message: An account with this phone number already exists.
                      param: phone
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteCurrentUser
      tags: [Users]
      summary: Delete the account
      description: |
        Permanently deletes the account and everything it owns: CVs and
        their sections, job searches, their results and evaluations, API
        keys and portal suggestions. Deleted and revoked items are removed
        too. Job postings are shared between users and are kept. This cannot
        be undone; download your data first with `GET /me/export`.

        The password is required even when calling with an API key. All of
        the account's session tokens and API keys stop working.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
            example:
              password: correct-horse-battery
      responses:
        '204':
          description: The account and all of its data were deleted.
        '400':
          description: |
            The body is malformed (`invalid_json`), the password is missing
            (`parameter_missing`) or it is wrong (`incorrect_password`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  type: invalid_request_error
                  code: incorrect_password
                  message: The password is incorrect.
                  param: password
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /me/password:
    post:
      operationId: changePassword
      tags: [Users]
      summary: Change the password
      description: |
        Replaces the password after checking the current one. The new
        password follows the signup rules. Every session token issued before
        the change stops working (sign other devices in again); the response
        carries a fresh session token so this client stays signed in.

        API keys keep working: they are not tied to the password. Revoke
        them with `DELETE /api-keys/{id}` if you think one leaked.

        Session token times have one-second precision, so a token issued in
        the same second as the change, just before it, is not revoked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              current_password: correct-horse-battery
              new_password: staple-battery-horse-correct
      responses:
        '200':
          description: The password was changed. Use the new session token from now on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              examples:
                session:
                  $ref: '#/components/examples/Session'
        '400':
          description: |
            The body is malformed (`invalid_json`), a parameter is missing
            (`parameter_missing`), the new password breaks the rules
            (`parameter_invalid`, `param: new_password`) or the current
            password is wrong (`incorrect_password`,
            `param: current_password`). A wrong current password is a 400,
            not a 401: the session itself is still valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                incorrect:
                  summary: Wrong current password
                  value:
                    error:
                      type: invalid_request_error
                      code: incorrect_password
                      message: The password is incorrect.
                      param: current_password
                weak:
                  summary: New password too short
                  value:
                    error:
                      type: invalid_request_error
                      code: parameter_invalid
                      message: The password must be at least 8 characters long.
                      param: new_password
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /me/export:
    get:
      operationId: exportCurrentUser
      tags: [Users]
      summary: Download your data
      description: |
        Returns everything stored about the account as one JSON document,
        offered as a download (`Content-Disposition: attachment;
        filename="cv-evaluator-export.json"`): the profile, CVs with their
        extracted text and sections, job searches, results with their job
        and evaluations, API key metadata and portal suggestions. Deleted
        CVs and searches and revoked keys are still stored, so they are
        included with their deletion time.

        It never contains the password hash, API key secrets or hashes,
        embedding vectors or raw LLM output.
      responses:
        '200':
          description: The export.
          headers:
            Content-Disposition:
              description: Always `attachment; filename="cv-evaluator-export.json"`.
              schema:
                type: string
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountExport'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api-keys:
    post:
      operationId: createApiKey
      tags: [API keys]
      summary: Create an API key
      description: |
        Creates a new personal API key for the current user.

        **The `secret` is only returned in this response.** It is never
        stored in plain text and cannot be retrieved again; if you lose it,
        revoke the key and create another.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
            example:
              name: CI pipeline
      responses:
        '201':
          description: The key was created. Copy the `secret` now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyWithSecret'
              example:
                object: api_key
                id: 01J9ZM2B7C4D6E8F0G1H2J3K4M
                name: CI pipeline
                prefix: sk_live_7Qm2
                secret: sk_live_7Qm2_example_secret_shown_only_once
                created_at: '2026-10-16T09:30:00Z'
                last_used_at: null
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listApiKeys
      tags: [API keys]
      summary: List API keys
      description: |
        Returns the current user's active API keys, newest first. Revoked
        keys are not included. Secrets are never returned; use `prefix` to
        tell keys apart.
      responses:
        '200':
          description: The caller's keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyList'
              example:
                object: list
                data:
                  - object: api_key
                    id: 01J9ZM2B7C4D6E8F0G1H2J3K4M
                    name: CI pipeline
                    prefix: sk_live_7Qm2
                    created_at: '2026-10-16T09:30:00Z'
                    last_used_at: '2026-10-16T11:02:17Z'
                  - object: api_key
                    id: 01J9ZK6H3P8Q4W2X5Y7R1T0V3N
                    name: Laptop
                    prefix: sk_live_Zq81
                    created_at: '2026-10-01T08:00:00Z'
                    last_used_at: null
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /api-keys/{id}:
    delete:
      operationId: deleteApiKey
      tags: [API keys]
      summary: Revoke an API key
      description: |
        Permanently revokes one of the current user's API keys. Requests made
        with the key fail with `invalid_api_key` from this moment on. This
        cannot be undone.

        Keys belonging to other users are reported as not found.
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the key to revoke.
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: The key was revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedApiKey'
              example:
                object: api_key
                id: 01J9ZM2B7C4D6E8F0G1H2J3K4M
                deleted: true
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /job-searches:
    post:
      operationId: createJobSearch
      tags: [Job searches]
      summary: Create a job search
      description: |
        Saves a search that runs on a schedule against every supported job
        portal (see `GET /providers`). An enabled search is due straight
        away, so its first run starts on the scheduler's next tick; after
        that it runs once per `frequency`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobSearchRequest'
            example:
              name: Go jobs in Copenhagen
              query: senior go engineer
              location: Copenhagen
              frequency: daily
      responses:
        '201':
          description: The search was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSearch'
              examples:
                jobSearch:
                  $ref: '#/components/examples/JobSearch'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listJobSearches
      tags: [Job searches]
      summary: List job searches
      description: Returns the current user's job searches, newest first.
      responses:
        '200':
          description: The caller's job searches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSearchList'
              example:
                object: list
                data:
                  - object: job_search
                    id: 01JA2B3C4D5E6F7G8H9J0K1M2N
                    name: Go jobs in Copenhagen
                    query: senior go engineer
                    location: Copenhagen
                    frequency: daily
                    enabled: true
                    last_run_at: '2026-10-16T09:00:04Z'
                    next_run_at: '2026-10-17T09:00:04Z'
                    created_at: '2026-10-15T09:00:00Z'
                    updated_at: '2026-10-16T09:00:04Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /job-searches/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The id of the job search.
        schema:
          $ref: '#/components/schemas/Ulid'
    get:
      operationId: getJobSearch
      tags: [Job searches]
      summary: Retrieve a job search
      description: Returns one of the current user's job searches.
      responses:
        '200':
          description: The job search.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSearch'
              examples:
                jobSearch:
                  $ref: '#/components/examples/JobSearch'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/JobSearchNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateJobSearch
      tags: [Job searches]
      summary: Update a job search
      description: |
        Updates the fields present in the body; omitted fields keep their
        value.

        - Setting `enabled` to `false` pauses the search and clears
          `next_run_at`.
        - Setting it back to `true` makes the search due straight away.
        - Changing `frequency` on a search that has already run reschedules
          it from `last_run_at`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJobSearchRequest'
            examples:
              pause:
                summary: Pause a search
                value:
                  enabled: false
              weekly:
                summary: Run weekly in Aarhus
                value:
                  location: Aarhus
                  frequency: weekly
      responses:
        '200':
          description: The updated job search.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSearch'
              example:
                object: job_search
                id: 01JA2B3C4D5E6F7G8H9J0K1M2N
                name: Go jobs in Copenhagen
                query: senior go engineer
                location: Copenhagen
                frequency: daily
                enabled: false
                last_run_at: '2026-10-16T09:00:04Z'
                next_run_at: null
                created_at: '2026-10-15T09:00:00Z'
                updated_at: '2026-10-16T12:30:00Z'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/JobSearchNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteJobSearch
      tags: [Job searches]
      summary: Delete a job search
      description: Deletes one of the current user's job searches. It stops running immediately.
      responses:
        '200':
          description: The job search was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedJobSearch'
              example:
                object: job_search
                id: 01JA2B3C4D5E6F7G8H9J0K1M2N
                deleted: true
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/JobSearchNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /job-searches/{id}/run:
    post:
      operationId: runJobSearch
      tags: [Job searches]
      summary: Run a job search now
      description: |
        Queues an enabled search to run on the scheduler's next tick, instead
        of waiting for `next_run_at`. The run happens in the background, so
        the response is `202 Accepted` with `next_run_at` set to now. A
        disabled search cannot be run; enable it first.
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the job search.
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        '202':
          description: The run was queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSearch'
              examples:
                jobSearch:
                  $ref: '#/components/examples/JobSearch'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/JobSearchNotFound'
        '409':
          description: The job search is disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  type: invalid_request_error
                  code: job_search_disabled
                  message: The job search is disabled. Enable it before running it.
        '500':
          $ref: '#/components/responses/InternalError'

  /providers:
    get:
      operationId: listProviders
      tags: [Job portals]
      summary: List supported job portals
      description: |
        Returns the job portals the platform searches. This list is
        informational: every job search runs against all of them, and there
        is nothing to choose. To ask for another portal, use
        `POST /portal-suggestions`.
      responses:
        '200':
          description: The supported portals, sorted by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderList'
              example:
                object: list
                data:
                  - object: provider
                    name: jobindex
                    display_name: Jobindex
                    website: https://www.jobindex.dk
                    coverage: Denmark
                  - object: provider
                    name: linkedin
                    display_name: LinkedIn
                    website: https://www.linkedin.com/jobs
                    coverage: Worldwide
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /portal-suggestions:
    post:
      operationId: createPortalSuggestion
      tags: [Job portals]
      summary: Suggest a job portal
      description: |
        Suggests a job portal the platform should also search. The team
        reviews suggestions and builds support for the ones it accepts; the
        suggestion's `status` shows how far it got.

        URLs are normalized before they are stored (`https`, lowercase host
        without `www.`, no trailing slash or fragment), and a scheme is
        optional: `stepstone.de` and `https://www.StepStone.de/` are the same
        suggestion. Suggesting the same portal twice returns `409` with code
        `portal_already_suggested`; suggesting a portal that is already
        supported returns `409` with code `portal_already_supported`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePortalSuggestionRequest'
            example:
              name: StepStone
              url: https://www.stepstone.de
              note: Most of the Go roles in Germany are posted here.
      responses:
        '201':
          description: The suggestion was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalSuggestion'
              examples:
                suggestion:
                  $ref: '#/components/examples/PortalSuggestion'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: |
            You already suggested this portal (`portal_already_suggested`;
            the message includes the existing suggestion's id), or the portal
            is already searched (`portal_already_supported`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                suggested:
                  summary: Already suggested
                  value:
                    error:
                      type: invalid_request_error
                      code: portal_already_suggested
                      message: You have already suggested this portal as 01JA3C4D5E6F7G8H9J0K1M2N3P.
                      param: url
                supported:
                  summary: Already supported
                  value:
                    error:
                      type: invalid_request_error
                      code: portal_already_supported
                      message: This portal is already searched. See GET /providers.
                      param: url
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listPortalSuggestions
      tags: [Job portals]
      summary: List your portal suggestions
      description: Returns the portals the current user has suggested, newest first.
      responses:
        '200':
          description: The caller's suggestions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalSuggestionList'
              example:
                object: list
                data:
                  - object: portal_suggestion
                    id: 01JA3C4D5E6F7G8H9J0K1M2N3P
                    name: StepStone
                    url: https://stepstone.de
                    note: Most of the Go roles in Germany are posted here.
                    status: planned
                    created_at: '2026-10-16T10:00:00Z'
                    updated_at: '2026-10-16T14:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A session token returned by `POST /auth/signup` or
        `POST /auth/signin`, sent as `Authorization: Bearer <token>`.
        Session tokens expire after 24 hours; sign in again to get a new one.
        Changing the password revokes the tokens issued before the change.
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: sk_live_...
      description: |
        A personal API key created with `POST /api-keys`, sent as
        `Authorization: Bearer sk_live_...`. Keys do not expire, but can be
        revoked at any time.

  schemas:
    Ulid:
      type: string
      description: A ULID, the format of every object id.
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      minLength: 26
      maxLength: 26
      examples:
        - 01J9ZK6H3P8Q4W2X5Y7R1T0V3N

    SignupRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: The user's email address. Stored lowercased; must be unique.
        password:
          type: string
          format: password
          minLength: 8
          description: At least 8 characters and at most 72 bytes.
          writeOnly: true
        first_name:
          type: string
          description: Given name.
        last_name:
          type: string
          description: Family name.
        phone:
          type: string
          description: Phone number, free-form. Must be unique when given.

    SigninRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          writeOnly: true

    User:
      type: object
      description: A person with an account.
      required: [object, id, first_name, last_name, email, phone]
      properties:
        object:
          type: string
          const: user
          description: String representing the object's type.
        id:
          $ref: '#/components/schemas/Ulid'
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          description: Empty when no phone number was given.

    Session:
      type: object
      description: A signed-in session.
      required: [object, token, token_type, user]
      properties:
        object:
          type: string
          const: session
        token:
          type: string
          description: |
            The session token. Send it as `Authorization: Bearer <token>`.
            Valid for 24 hours, or until the password is changed.
        token_type:
          type: string
          const: Bearer
        user:
          $ref: '#/components/schemas/User'

    UpdateUserRequest:
      type: object
      description: Only the fields present are changed.
      minProperties: 0
      properties:
        first_name:
          type: string
          description: Given name. Trimmed; may be empty.
        last_name:
          type: string
          description: Family name. Trimmed; may be empty.
        email:
          type: string
          format: email
          description: Trimmed and lowercased; must be valid and not used by another account.
        phone:
          type: string
          description: Trimmed; may be empty. When not empty, must not be used by another account.

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
          writeOnly: true
        new_password:
          type: string
          format: password
          minLength: 8
          description: At least 8 characters and at most 72 bytes.
          writeOnly: true

    DeleteAccountRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
          description: The account's current password, also when calling with an API key.
          writeOnly: true

    AccountExport:
      type: object
      description: Everything stored about an account.
      required: [object, exported_at, profile, cvs, job_searches, results, api_keys, portal_suggestions]
      properties:
        object:
          type: string
          const: account_export
        exported_at:
          type: string
          format: date-time
        profile:
          type: object
          required: [id, first_name, last_name, email, phone, created_at, updated_at, password_changed_at]
          properties:
            id:
              $ref: '#/components/schemas/Ulid'
            first_name:
              type: string
            last_name:
              type: string
            email:
              type: string
            phone:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            password_changed_at:
              type: [string, 'null']
              format: date-time
        cvs:
          type: array
          items:
            type: object
            required: [id, extracted_content, sections, created_at, updated_at, deleted_at]
            properties:
              id:
                $ref: '#/components/schemas/Ulid'
              extracted_content:
                type: string
                description: The text extracted from the uploaded file.
              sections:
                type: array
                items:
                  type: object
                  required: [heading, content]
                  properties:
                    heading:
                      type: string
                    content:
                      type: string
              created_at:
                type: string
                format: date-time
              updated_at:
                type: string
                format: date-time
              deleted_at:
                type: [string, 'null']
                format: date-time
        job_searches:
          type: array
          items:
            type: object
            required: [id, name, query, location, frequency, enabled, last_run_at, next_run_at, created_at, updated_at, deleted_at]
            properties:
              id:
                $ref: '#/components/schemas/Ulid'
              name:
                type: string
              query:
                type: string
              location:
                type: string
              frequency:
                $ref: '#/components/schemas/Frequency'
              enabled:
                type: boolean
              last_run_at:
                type: [string, 'null']
                format: date-time
              next_run_at:
                type: [string, 'null']
                format: date-time
              created_at:
                type: string
                format: date-time
              updated_at:
                type: string
                format: date-time
              deleted_at:
                type: [string, 'null']
                format: date-time
        results:
          type: array
          description: Jobs the account's searches found, with their evaluations.
          items:
            type: object
            required: [id, job_search_id, status, evaluation_status, created_at, updated_at, job, evaluations]
            properties:
              id:
                $ref: '#/components/schemas/Ulid'
              job_search_id:
                $ref: '#/components/schemas/Ulid'
              status:
                type: string
                enum: [new, saved, applied, dismissed]
              evaluation_status:
                type: string
                enum: [pending, processing, done, failed]
              created_at:
                type: string
                format: date-time
              updated_at:
                type: string
                format: date-time
              job:
                type: [object, 'null']
                required: [id, provider, title, company, location, posted_at, details_url]
                properties:
                  id:
                    $ref: '#/components/schemas/Ulid'
                  provider:
                    type: string
                  title:
                    type: string
                  company:
                    type: string
                  location:
                    type: string
                  posted_at:
                    type: string
                  details_url:
                    type: string
              evaluations:
                type: array
                items:
                  type: object
                  required: [id, cv_id, status, overall_score, scores, strengths, missing_skills, summary, model, prompt_version, created_at, updated_at]
                  properties:
                    id:
                      $ref: '#/components/schemas/Ulid'
                    cv_id:
                      $ref: '#/components/schemas/Ulid'
                    status:
                      type: string
                      enum: [completed, failed]
                    overall_score:
                      type: integer
                      minimum: 0
                      maximum: 100
                    scores:
                      type: array
                      items:
                        type: object
                        required: [criterion, score, reason]
                        properties:
                          criterion:
                            type: string
                          score:
                            type: integer
                          reason:
                            type: string
                    strengths:
                      type: array
                      items:
                        type: string
                    missing_skills:
                      type: array
                      items:
                        type: string
                    summary:
                      type: string
                    error:
                      type: string
                      description: Why the evaluation failed, when it did.
                    model:
                      type: string
                    prompt_version:
                      type: string
                    created_at:
                      type: string
                      format: date-time
                    updated_at:
                      type: string
                      format: date-time
        api_keys:
          type: array
          description: Key metadata only; never secrets or hashes.
          items:
            type: object
            required: [id, name, prefix, created_at, last_used_at, revoked_at]
            properties:
              id:
                $ref: '#/components/schemas/Ulid'
              name:
                type: string
              prefix:
                type: string
              created_at:
                type: string
                format: date-time
              last_used_at:
                type: [string, 'null']
                format: date-time
              revoked_at:
                type: [string, 'null']
                format: date-time
        portal_suggestions:
          type: array
          items:
            type: object
            required: [id, name, url, note, status, created_at, updated_at]
            properties:
              id:
                $ref: '#/components/schemas/Ulid'
              name:
                type: string
              url:
                type: string
              note:
                type: string
              status:
                $ref: '#/components/schemas/PortalSuggestionStatus'
              created_at:
                type: string
                format: date-time
              updated_at:
                type: string
                format: date-time

    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: |
            A label to help you recognise the key later, such as where it is
            used. Leading and trailing whitespace is trimmed.

    ApiKey:
      type: object
      description: A personal API key. The secret is never included.
      required: [object, id, name, prefix, created_at, last_used_at]
      properties:
        object:
          type: string
          const: api_key
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
          description: The label given at creation.
        prefix:
          type: string
          description: The first 12 characters of the key, safe to display.
          examples:
            - sk_live_7Qm2
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, 'null']
          format: date-time
          description: |
            When the key last authenticated a request, or `null` if it never
            has. Updated at most once a minute.

    ApiKeyWithSecret:
      description: An API key as returned at creation, including its secret.
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: |
                The full API key: `sk_live_` followed by 40 alphanumeric
                characters. Shown only once; it cannot be retrieved again.

    ApiKeyList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'

    DeletedApiKey:
      type: object
      required: [object, id, deleted]
      properties:
        object:
          type: string
          const: api_key
        id:
          $ref: '#/components/schemas/Ulid'
        deleted:
          type: boolean
          const: true

    Frequency:
      type: string
      description: |
        How often a job search runs: `hourly`, `daily` or `weekly`.
      enum: [hourly, daily, weekly]

    CreateJobSearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 200
          description: Keywords to search for, such as a job title or skill.
        location:
          type: string
          maxLength: 200
          description: City, region or country to search in. Optional.
        name:
          type: string
          maxLength: 100
          description: A label for the search. Defaults to `query`.
        frequency:
          allOf:
            - $ref: '#/components/schemas/Frequency'
          default: daily
        enabled:
          type: boolean
          default: true
          description: Whether the search runs on its schedule.

    UpdateJobSearchRequest:
      type: object
      description: Every field is optional; only the fields sent are changed.
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 200
        location:
          type: string
          maxLength: 200
          description: Send an empty string to search everywhere.
        name:
          type: string
          maxLength: 100
          description: Send an empty string to reset it to `query`.
        frequency:
          $ref: '#/components/schemas/Frequency'
        enabled:
          type: boolean

    JobSearch:
      type: object
      description: |
        A saved search that runs on a schedule against every supported job
        portal.
      required: [object, id, name, query, location, frequency, enabled, last_run_at, next_run_at, created_at, updated_at]
      properties:
        object:
          type: string
          const: job_search
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        query:
          type: string
        location:
          type: string
          description: Empty when the search is not limited to a location.
        frequency:
          $ref: '#/components/schemas/Frequency'
        enabled:
          type: boolean
        last_run_at:
          type: [string, 'null']
          format: date-time
          description: When the search last ran, or `null` if it has not run yet.
        next_run_at:
          type: [string, 'null']
          format: date-time
          description: When the search is due to run next, or `null` while it is disabled.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    JobSearchList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/JobSearch'

    DeletedJobSearch:
      type: object
      required: [object, id, deleted]
      properties:
        object:
          type: string
          const: job_search
        id:
          $ref: '#/components/schemas/Ulid'
        deleted:
          type: boolean
          const: true

    Provider:
      type: object
      description: A job portal the platform searches.
      required: [object, name, display_name, website, coverage]
      properties:
        object:
          type: string
          const: provider
        name:
          type: string
          description: Stable identifier, also used as the provider of scraped jobs.
          examples:
            - linkedin
        display_name:
          type: string
          examples:
            - LinkedIn
        website:
          type: string
          format: uri
        coverage:
          type: string
          description: The country or region the portal lists jobs for.
          examples:
            - Denmark

    ProviderList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/Provider'

    PortalSuggestionStatus:
      type: string
      description: |
        Where the suggestion is in review:

        - `submitted`: received, not reviewed yet.
        - `planned`: accepted; support is being built.
        - `added`: the portal is now searched.
        - `declined`: the portal will not be added.
      enum: [submitted, planned, added, declined]

    CreatePortalSuggestionRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          maxLength: 2048
          description: |
            The portal's address, for example `https://www.stepstone.de`. The
            scheme is optional and defaults to `https`.
        name:
          type: string
          maxLength: 100
          description: The portal's name. Defaults to the URL's host.
        note:
          type: string
          maxLength: 1000
          description: Anything that helps the team, such as which jobs you find there.

    PortalSuggestion:
      type: object
      description: A job portal a user asked the platform to support.
      required: [object, id, name, url, note, status, created_at, updated_at]
      properties:
        object:
          type: string
          const: portal_suggestion
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        url:
          type: string
          format: uri
          description: The normalized URL.
        note:
          type: string
        status:
          $ref: '#/components/schemas/PortalSuggestionStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PortalSuggestionList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/PortalSuggestion'

    Error:
      type: object
      required: [type, message]
      properties:
        type:
          type: string
          description: |
            The category of error:

            - `invalid_request_error`: the request was malformed, failed
              validation, referenced a missing object, or conflicts with
              existing data.
            - `authentication_error`: no valid credential was supplied.
            - `api_error`: something went wrong on our side. These are rare;
              retrying later is safe for idempotent requests.
          enum:
            - invalid_request_error
            - authentication_error
            - api_error
        code:
          type: string
          description: |
            A short, stable string identifying the specific error, when there
            is one.
          enum:
            - invalid_json
            - parameter_missing
            - parameter_invalid
            - resource_missing
            - missing_credentials
            - invalid_credentials
            - invalid_token
            - invalid_api_key
            - email_already_used
            - phone_already_used
            - incorrect_password
            - job_search_disabled
            - portal_already_suggested
            - portal_already_supported
            - internal_error
            - timeout
        message:
          type: string
          description: A human-readable explanation. May change; do not parse it.
        param:
          type: string
          description: The request parameter the error relates to, if any.

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'

  responses:
    InvalidRequest:
      description: |
        The request was malformed (`invalid_json`) or a parameter was missing
        (`parameter_missing`) or invalid (`parameter_invalid`). `param` names
        the offending field.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing:
              summary: Missing parameter
              value:
                error:
                  type: invalid_request_error
                  code: parameter_missing
                  message: The email parameter is required.
                  param: email
            invalid:
              summary: Invalid parameter
              value:
                error:
                  type: invalid_request_error
                  code: parameter_invalid
                  message: The password must be at least 8 characters long.
                  param: password
            json:
              summary: Malformed body
              value:
                error:
                  type: invalid_request_error
                  code: invalid_json
                  message: The request body must be a valid JSON object.

    Unauthenticated:
      description: |
        No credential was sent (`missing_credentials`), or the session token
        (`invalid_token`) or API key (`invalid_api_key`) is invalid, expired
        or revoked. A session token is revoked when the password changes
        after it was issued or the account is deleted.
      headers:
        WWW-Authenticate:
          description: Always `Bearer realm="cv-evaluator"`.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing:
              summary: No credential
              value:
                error:
                  type: authentication_error
                  code: missing_credentials
                  message: "No valid credentials provided. Send an 'Authorization: Bearer <token>' header with a session token or API key."
            token:
              summary: Expired session token
              value:
                error:
                  type: authentication_error
                  code: invalid_token
                  message: The session token is invalid or has expired.
            revoked:
              summary: Session from before a password change, or of a deleted account
              value:
                error:
                  type: authentication_error
                  code: invalid_token
                  message: The session is no longer valid. Sign in again.
            apiKey:
              summary: Revoked API key
              value:
                error:
                  type: authentication_error
                  code: invalid_api_key
                  message: The API key provided is invalid or has been revoked.

    NotFound:
      description: The requested object does not exist or belongs to another user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: invalid_request_error
              code: resource_missing
              message: No such API key.
              param: id

    AccountNotFound:
      description: |
        The account no longer exists, for example because it was deleted by
        a concurrent request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: invalid_request_error
              code: resource_missing
              message: The account does not exist.

    JobSearchNotFound:
      description: The job search does not exist or belongs to another user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: invalid_request_error
              code: resource_missing
              message: No such job search.
              param: id

    InternalError:
      description: An unexpected error on our side. No internal details are exposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              type: api_error
              code: internal_error
              message: An unexpected error occurred. Please try again later.

  examples:
    User:
      summary: A user
      value:
        object: user
        id: 01J9ZK6H3P8Q4W2X5Y7R1T0V3N
        first_name: Ada
        last_name: Lovelace
        email: ada@example.com
        phone: '+4512345678'
    Session:
      summary: A session
      value:
        object: session
        token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIwMUo5Wks2SDNQOFE0VzJYNVk3UjFUMFYzTiJ9.signature
        token_type: Bearer
        user:
          object: user
          id: 01J9ZK6H3P8Q4W2X5Y7R1T0V3N
          first_name: Ada
          last_name: Lovelace
          email: ada@example.com
          phone: '+4512345678'
    JobSearch:
      summary: A job search
      value:
        object: job_search
        id: 01JA2B3C4D5E6F7G8H9J0K1M2N
        name: Go jobs in Copenhagen
        query: senior go engineer
        location: Copenhagen
        frequency: daily
        enabled: true
