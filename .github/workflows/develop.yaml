name: Lint and Test
on:
  push:
    branches:
      - "develop"
    paths-ignore:
      - "**/*.md"
      - "**/*.MD"

  pull_request:
    branches:
      - "main"
      - "develop"
      - "testing"
    paths-ignore:
      - "**/*.md"
      - "**/*.MD"

# One run per pull request (or branch) at a time: a new push cancels the
# run for the commit it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      # setup-go caches modules and the build cache, keyed on go.sum.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Lint and Vet
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10
          args: --timeout=3m

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Test
        env:
          ENVIRONMENT: cicd
        run: make test

  test-with-race:
    name: Test With Race
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Test
        env:
          ENVIRONMENT: cicd
        run: make test-with-race


  test-with-multiple-and-shuffle:
    name: Test With Shuffle and Multiple
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Test
        run: make shuffle-test
