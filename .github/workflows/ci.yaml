name: Aptly Test and Build
on:
  push:
    branches:
      - "main"
      - "staging"
      - "testing"
    paths-ignore:
      - "**/*.md"
      - "**/*.MD"

  workflow_dispatch:
    inputs:
      test:
        description: 'Click Run to run the deployment'
        required: false
        default: 'testing'

# One run per branch at a time. On main every commit is still checked: a new
# push waits for the running one. Elsewhere the older run is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      # setup-go caches modules and the build cache, keyed on go.sum.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Lint and Vet
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Test
        env:
          ENVIRONMENT: cicd
        run: make test
