name: Aptly Test and Build
on:
  push:
    branches:
      - "main"
      - "staging"
      - "testing"

  workflow_dispatch:
    inputs:
      test:
        description: 'Click Run to run the deployment'
        required: false
        default: 'testing'

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Lint and Vet
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Test
        env:
          ENVIRONMENT: cicd
        run: make test