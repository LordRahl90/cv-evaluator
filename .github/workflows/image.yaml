name: Image

# Builds the app image (API + web app + worker) and pushes it to GHCR on
# every push to main. The cluster's Argo CD Image Updater follows the `main`
# tag and rolls out each new digest, so merging to main is the release.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "**.MD"
      - "docs/**"
  workflow_dispatch:

# One build per ref at a time; a newer push waits rather than cancelling a
# build that may already be rolling out.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cv-evaluator

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: SERVICE_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
