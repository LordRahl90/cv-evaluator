services:
  database:
    image: pgvector/pgvector:pg16
    container_name: cv_evaluator_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cv_evaluator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - cv-solution
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  open-webui:
    image: ghcr.io/open-webui/open-webui
    container_name: open-webui
    ports:
      - "3080:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - ollama
    volumes:
      - ./open-webui:/app/backend/data
    networks:
      - cv-solution

  ollama:
    image: ollama/ollama:0.10.0
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./ollama:/root/.ollama
    networks:
      - cv-solution
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Pulls the embedding model once ollama is up, then exits.
  # Already-downloaded models are skipped, so restarts are quick.
  ollama-models:
    image: ollama/ollama:0.10.0
    container_name: ollama-models
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: [ "ollama", "pull", "nomic-embed-text" ]
    networks:
      - cv-solution

  # Local observability stack: `docker compose --profile observability up -d`
  # and set OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: cv_evaluator_otel_collector
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./docker/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus metrics
    depends_on:
      - jaeger
    networks:
      - cv-solution

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: cv_evaluator_jaeger
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
    networks:
      - cv-solution

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: cv_evaluator_prometheus
    profiles: ["observability"]
    volumes:
      - ./docker/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090" # Prometheus UI
    depends_on:
      - otel-collector
    networks:
      - cv-solution

networks:
  cv-solution:
    driver: bridge

volumes:
  postgres_data:
